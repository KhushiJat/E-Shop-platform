spring.application.name=SpringBoot-ecom

# Ensure your URL is formatted exactly like this
spring.datasource.url=${DATASOURCE_URL}

# Ensure these match your MySQL database credentials
spring.datasource.username=${DATASOURCE_USER}
spring.datasource.password=${DATASOURCE_PASSWORD}

# Keep these standard settings for JPA
#spring.jpa.hibernate.ddl-auto=create
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

project.image=images/

frontend.url= ${FRONTEND_URL}

image.base.url=http://localhost:8080/images

#STRIPE KEY
stripe.secret.key=${STRIPE_SECRET_KEY}

spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:org/springframework/security/core/userdetails/jdbc/users.ddl

spring.jpa.show-sql-datasource-initialization= true

spring.app.jwtSecret=${JWT_SECRET}
spring.app.jwtExpirationMs=3000000
 spring.ecom.app.jwtCookieName=springBootEcom

logging.level.org.springframework=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.com.ecommerce.project=DEBUG

#spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

